<svg width="680" height="716" viewBox="0 0 680 716" xmlns="http://www.w3.org/2000/svg" role="img">
<title>PMPML transit analytics data architecture pipeline</title>
<desc>Flow from raw GTFS feed through data quality validation, star schema warehouse, into two parallel analysis branches (crowding risk model and ETA graph engine), merging into a Streamlit dashboard deployed as a live app.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect width="680" height="716" fill="#ffffff"/>

<line x1="340" y1="96" x2="340" y2="156" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="212" x2="340" y2="272" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="328" x2="200" y2="388" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="328" x2="480" y2="388" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="200" y1="444" x2="340" y2="504" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="480" y1="444" x2="340" y2="504" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="560" x2="340" y2="620" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="190" y="40" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="58" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Raw GTFS feed</text>
<text x="340" y="80" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">routes, stops, trips, stop_times</text>
</g>

<g>
<rect x="190" y="156" width="300" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="174" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">Data quality validation</text>
<text x="340" y="196" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">nulls, duplicates, integrity</text>
</g>

<g>
<rect x="190" y="272" width="300" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="290" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">Star schema warehouse</text>
<text x="340" y="312" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">DuckDB fact + dimension tables</text>
</g>

<g>
<rect x="70" y="388" width="260" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="200" y="406" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Crowding risk model</text>
<text x="200" y="428" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">headway-based scoring</text>
</g>

<g>
<rect x="350" y="388" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="480" y="406" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">ETA graph engine</text>
<text x="480" y="428" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">NetworkX + Dijkstra</text>
</g>

<g>
<rect x="190" y="504" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="522" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Streamlit dashboard</text>
<text x="340" y="544" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">risk, coverage, ETA tabs</text>
</g>

<g>
<rect x="190" y="620" width="300" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="340" y="638" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#173404">Live interactive app</text>
<text x="340" y="660" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#27500A">deployed &amp; public</text>
</g>
</svg>
